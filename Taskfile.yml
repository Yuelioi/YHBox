version: '3'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml

vars:
  APP_NAME: "Yotta"
  BIN_DIR: "bin"
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'

tasks:
  build:
    summary: Builds the application
    deps: [wails:verify]
    cmds:
      - task: "windows:build"

  package:
    summary: Packages a production build of the application
    deps: [wails:verify]
    cmds:
      - task: "windows:package"

  run:
    summary: Runs the application
    cmds:
      - task: "windows:run"

  dev:
    summary: Runs the application in development mode
    deps: [wails:verify]
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  dll:
    summary: 单独打包 Rust WGC capture DLL → bin/capture_wgc.dll (改 .rs 后跑)
    cmds:
      - task: "windows:build:capture-dll"

  nodes:
    summary: 导出节点速查表(Markdown)；要 JSON 用 `go run ./cmd/node-catalog export`
    cmds:
      - go run ./cmd/node-catalog export --md

  nodes:pins:
    summary: 一键提取全节点 pin 名(按名合并 + 命名分裂告警, Markdown)；存文件 `task nodes:pins > pins.md`
    cmds:
      - go run ./cmd/node-catalog pins

  version:verify:
    summary: 验证所有版本元数据与 pkg/version.Version 一致
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/verify-version.ps1

  wails:verify:
    summary: 验证 Wails library、source pin 与 PATH 中 CLI 版本一致
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/verify-wails-version.ps1 -CheckInstalled

  version:bump:
    summary: 更新版本文件、提交并创建 vX.Y.Z tag
    desc: |
      用法: task version:bump VERSION=2.0.1
      脚本会要求工作区干净，更新所有版本文件，提交 chore(release)，再创建 tag。
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/bump-version.ps1 -Version {{.VERSION}}
    requires:
      vars: [VERSION]
