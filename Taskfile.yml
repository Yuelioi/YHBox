version: '3'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml

vars:
  APP_NAME: "Yotta"
  BIN_DIR: "bin"
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "windows:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "windows:package"

  run:
    summary: Runs the application
    cmds:
      - task: "windows:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  dll:
    summary: 单独打包 Rust WGC capture DLL → bin/capture_wgc.dll (改 .rs 后跑)
    cmds:
      - task: "windows:build:capture-dll"

  nodes:
    summary: 导出节点速查表(Markdown)；要 JSON 用 `go run ./cmd/node-catalog export`
    cmds:
      - go run ./cmd/node-catalog export --md

  nodes:pins:
    summary: 一键提取全节点 pin 名(按名合并 + 命名分裂告警, Markdown)；存文件 `task nodes:pins > pins.md`
    cmds:
      - go run ./cmd/node-catalog pins

  version:sync:
    summary: 把 pkg/version.Version 同步到 build/config.yml / windows/info.json / frontend/package.json
    desc: |
      版本号源 = pkg/version/version.go 里的 const Version。
      这条 task 把它写到所有附属文件里。改版本只需要：
        1) 改 pkg/version/version.go
        2) task version:sync
        3) commit
      依赖 sh + grep + sed（Windows 用 git-bash 自带）。
    cmds:
      - |
        VER=$(grep -oE 'const Version = "[^"]+"' pkg/version/version.go | sed -E 's/const Version = "(.*)"/\1/')
        if [ -z "$VER" ]; then
          echo "ERROR: 没找到 pkg/version/version.go 里的 const Version"
          exit 1
        fi
        echo "syncing version → $VER"
        sed -i -E "s/^  version: \"[^\"]+\"/  version: \"$VER\"/" build/config.yml
        sed -i -E "s/\"file_version\": \"[^\"]+\"/\"file_version\": \"$VER\"/" build/windows/info.json
        sed -i -E "s/\"ProductVersion\": \"[^\"]+\"/\"ProductVersion\": \"$VER\"/" build/windows/info.json
        sed -i -E "s/(\"version\":[[:space:]]*)\"[^\"]+\"/\1\"$VER\"/" frontend/package.json
        sed -i -E "s/(!define INFO_PRODUCTVERSION \")([^\"]+)(\")/\1$VER\3/" build/windows/nsis/wails_tools.nsh
        sed -i -E "s/(name=\"com\\.yhbox\\.app\" version=)\"[^\"]+\"/\1\"$VER\"/" build/windows/wails.exe.manifest
        echo "done. 检查 diff:"
        git diff --stat build/config.yml build/windows/info.json frontend/package.json build/windows/nsis/wails_tools.nsh build/windows/wails.exe.manifest

  version:bump:
    summary: 更新版本文件、提交并创建 vX.Y.Z tag
    desc: |
      用法: task version:bump VERSION=2.0.1
      脚本会要求工作区干净，更新所有版本文件，提交 chore(release)，再创建 tag。
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/bump-version.ps1 -Version {{.VERSION}}
    requires:
      vars: [VERSION]
