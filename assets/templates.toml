# YHFish 模板配置表（grouped 格式）
# embed 进 exe，描述 assets/ 里每个 PNG 的元数据。
#
# 格式：[[<tool>.<slot>]] 块，slot 由父级 key 自动推断（不再写 slot 字段）。
# 字段:
#   file        PNG 文件名（路径相对 assets/）
#   resolution  [W, H] 截图原始分辨率
#   bbox        [x1, y1, x2, y2] 模板在截图中的位置
#   note        说明文字（可选）
#
# 加新分辨率：
#   1. 截图 → 抠模板 → 命名（如 hook_text_1440.png）→ 丢 assets/<tool>/
#   2. 在本文件加一个 [[<tool>.<slot>]] 块
#   3. go build
#
# 用户外挂（无需改这里）：放 PNG 到 templates/<tool>/ 下，
# 在 templates/<tool>.toml 里写 [[<tool>.<slot>]] 块即可（同 (slot, resolution) 重复会被跳过）。

