version: '3'

includes:
  common: ../Taskfile.yml

vars:
  # Signing configuration - edit these values for your project
  # SIGN_CERTIFICATE: "path/to/certificate.pfx"
  # SIGN_THUMBPRINT: "certificate-thumbprint"  # Alternative to SIGN_CERTIFICATE
  # TIMESTAMP_SERVER: "http://timestamp.digicert.com"
  #
  # Password is stored securely in system keychain. Run: wails3 setup signing

tasks:
  build:
    summary: Builds the application for Windows
    cmds:
      - task: build:native
        vars:
          ARCH: '{{.ARCH}}'
          DEV: '{{.DEV}}'
          EXTRA_TAGS: '{{.EXTRA_TAGS}}'

  build:native:
    summary: Builds the application using native Go cross-compilation
    internal: true
    vars:
      # production tag 让 wails3 走 embed dist 而不是 vite dev server；
      # -H windowsgui 隐藏启动时弹的 cmd 黑窗口（wails3 是 GUI 应用）。
      # dev/EXTRA_TAGS 分支保留但默认走 production —— 本仓 dev workflow 走 `task dev`，
      # 不用过这条 task。如果以后需要纯 dev native build，传 DEV=true 进来。
      BUILD_FLAGS: '{{if eq .DEV "true"}}{{if .EXTRA_TAGS}}-tags {{.EXTRA_TAGS}} {{end}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui"{{end}}'
    deps:
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          DEV:
            ref: .DEV
      - task: build:adb
      - task: build:capture-dll
    cmds:
      - task: generate:syso
        vars:
          ARCH: '{{.ARCH}}'
      - go build -mod=readonly {{.BUILD_FLAGS}} -o "{{.BIN_DIR}}/{{.APP_NAME}}.exe"
      - cmd: powershell Remove-item *.syso
        platforms: [windows]
      - cmd: rm -f *.syso
        platforms: [linux, darwin]

    env:
      GOOS: windows
      CGO_ENABLED: '{{.CGO_ENABLED | default "0"}}'
      GOARCH: '{{.ARCH | default ARCH}}'
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly

  build:capture-dll:
    summary: |
      Builds the Rust WGC capture DLL (Windows Graphics Capture backend).
      Output: bin/capture_wgc.dll, loaded by pkg/capture at runtime via syscall.LazyDLL.
      cargo handles incremental builds; this task only re-copies the dll into bin/.
    sources:
      - "{{.ROOT_DIR}}/native/capture_wgc/Cargo.toml"
      - "{{.ROOT_DIR}}/native/capture_wgc/Cargo.lock"
      - "{{.ROOT_DIR}}/native/capture_wgc/src/**/*.rs"
    generates:
      - "{{.ROOT_DIR}}/{{.BIN_DIR}}/capture_wgc.dll"
    cmds:
      - cargo build --release --locked --manifest-path "{{.ROOT_DIR}}/native/capture_wgc/Cargo.toml"
      - cmd: powershell -NoProfile -Command "New-Item -ItemType Directory -Force -Path '{{.ROOT_DIR}}/{{.BIN_DIR}}' | Out-Null; Copy-Item '{{.ROOT_DIR}}/native/capture_wgc/target/release/capture_wgc.dll' '{{.ROOT_DIR}}/{{.BIN_DIR}}/capture_wgc.dll' -Force"
        platforms: [windows]
    preconditions:
      - sh: cargo --version > /dev/null 2>&1 || cargo.exe --version > /dev/null 2>&1
        msg: "cargo (Rust) not found in PATH. Install Rust toolchain: https://rustup.rs/"

  build:adb:
    summary: Copies the bundled Windows ADB runtime into bin/platform-tools.
    sources:
      - "{{.ROOT_DIR}}/build/windows/platform-tools/**/*"
    generates:
      - "{{.ROOT_DIR}}/{{.BIN_DIR}}/platform-tools/adb.exe"
    cmds:
      - cmd: powershell -NoProfile -Command "New-Item -ItemType Directory -Force -Path '{{.ROOT_DIR}}\\{{.BIN_DIR}}\\platform-tools' | Out-Null; Copy-Item -Path '{{.ROOT_DIR}}\\build\\windows\\platform-tools\\*' -Destination '{{.ROOT_DIR}}\\{{.BIN_DIR}}\\platform-tools' -Recurse -Force"
        platforms: [windows]
      - cmd: mkdir -p "{{.ROOT_DIR}}/{{.BIN_DIR}}/platform-tools" && cp -R "{{.ROOT_DIR}}/build/windows/platform-tools/." "{{.ROOT_DIR}}/{{.BIN_DIR}}/platform-tools/"
        platforms: [linux, darwin]

  generate:syso:
    summary: Generates Windows `.syso` file
    dir: build
    cmds:
      - wails3 generate syso -arch {{.ARCH}} -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ../wails_windows_{{.ARCH}}.syso
    vars:
      ARCH: '{{.ARCH | default ARCH}}'

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}.exe'

  sign:
    summary: Signs the Windows executable
    desc: |
      Signs the .exe with an Authenticode certificate.
      Configure SIGN_CERTIFICATE or SIGN_THUMBPRINT in the vars section at the top of this file.
      Password is retrieved from system keychain (run: wails3 setup signing)
    deps:
      - task: build
    cmds:
      - wails3 tool sign --input "{{.BIN_DIR}}/{{.APP_NAME}}.exe" {{if .SIGN_CERTIFICATE}}--certificate {{.SIGN_CERTIFICATE}}{{end}} {{if .SIGN_THUMBPRINT}}--thumbprint {{.SIGN_THUMBPRINT}}{{end}} {{if .TIMESTAMP_SERVER}}--timestamp {{.TIMESTAMP_SERVER}}{{end}}
    preconditions:
      - sh: '[ -n "{{.SIGN_CERTIFICATE}}" ] || [ -n "{{.SIGN_THUMBPRINT}}" ]'
        msg: "Either SIGN_CERTIFICATE or SIGN_THUMBPRINT is required. Set it in the vars section at the top of build/windows/Taskfile.yml"
