name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.117

      - name: Verify Wails toolchain pin
        shell: pwsh
        run: ./scripts/verify-wails-version.ps1 -CheckInstalled

      - name: Verify release version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          ./scripts/verify-version.ps1 -ExpectedVersion $tag

      - name: Build (task build)
        run: task build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Yotta ${{ github.ref_name }}
          body: |
            ## Yotta ${{ github.ref_name }}

            Windows 后台游戏自动化（Wails 3 + Vue 3）：
            - 🎣 钓鱼：全自动 + 售卖 + 补饵
            - 🔨 店长：锤子连点（固定坐标）
            - 🎼 超强音：4 轨判定 + 异步按键，100% 命中
            - 🎹 弹琴：读 MIDI 自动演奏
            - ⚔️ 战斗：Ctrl+Shift+1~6 全局热键切队伍

            ### 使用方法
            1. 下载 `Yotta.exe`，双击运行
            2. UAC 弹窗点"是"
            3. GUI 选 tab → 配置 → 开始

            设置存到 exe 同目录 `settings.json`。
          files: bin/Yotta.exe
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
