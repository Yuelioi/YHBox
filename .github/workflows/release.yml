name: Release Candidate (Frozen)

on:
  workflow_dispatch:

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  build:
    name: Frozen Windows candidate
    runs-on: windows-2025
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          check-latest: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: frontend/package.json

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned action commit
        with:
          toolchain: 1.97.0
          targets: x86_64-pc-windows-msvc

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.49.1
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pinned Go tools
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.6
          go install honnef.co/go/tools/cmd/staticcheck@v0.6.1

      - name: Verify and build
        shell: pwsh
        run: task package

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: artifacts/staging/Yotta
          format: spdx-json
          output-file: artifacts/yotta.spdx.json
          syft-version: v1.44.0
          upload-artifact: false
          upload-release-assets: false

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: artifacts/staging/Yotta
          format: cyclonedx-json
          output-file: artifacts/yotta.cdx.json
          syft-version: v1.44.0
          upload-artifact: false
          upload-release-assets: false

      - name: Write release checksums
        shell: pwsh
        run: |
          $paths = @(
            (Get-ChildItem artifacts/Yotta-*.zip).FullName,
            (Resolve-Path artifacts/yotta.spdx.json).Path,
            (Resolve-Path artifacts/yotta.cdx.json).Path
          )
          ./scripts/write-release-checksums.ps1 -Path $paths

      - name: Attest build provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: |
            artifacts/Yotta-*.zip
            artifacts/yotta.spdx.json
            artifacts/yotta.cdx.json
            artifacts/SHA256SUMS

      - name: Attest SPDX SBOM
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: artifacts/Yotta-*.zip
          sbom-path: artifacts/yotta.spdx.json

      - name: Upload frozen candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yotta-windows-release-candidate
          path: |
            artifacts/Yotta-*.zip
            artifacts/yotta.spdx.json
            artifacts/yotta.cdx.json
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
