name: Go CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: go-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux package-loading dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Scan reachable Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Check frontend production licenses
        run: |
          pnpm -C frontend install --frozen-lockfile
          pnpm -C frontend licenses list --prod --json > frontend/third-party-licenses.json
          node frontend/scripts/check-licenses.mjs frontend/third-party-licenses.json

      - name: Upload frontend license report
        uses: actions/upload-artifact@v4
        with:
          name: third-party-frontend-licenses
          path: frontend/third-party-licenses.json

  rust-supply-chain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Rust advisories and licenses
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: native/capture_wgc/Cargo.toml
          command: check advisories licenses
          arguments: --all-features

  quality-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify version metadata
        shell: pwsh
        run: ./scripts/verify-version.ps1

      - name: Verify Wails toolchain pin
        shell: pwsh
        run: ./scripts/verify-wails-version.ps1

      - name: Verify module identity
        shell: pwsh
        run: |
          $module = go list -m
          if ($module -ne "github.com/yottaapp/yotta") {
            throw "unexpected Go module path: $module"
          }

      - name: Test with coverage
        run: go test -count=1 -covermode=atomic -coverprofile coverage.out ./...

      - name: Vet
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.6.1

      - name: Staticcheck
        run: staticcheck ./...

      - name: Check and report third-party Go licenses
        shell: pwsh
        run: |
          go run ./cmd/check-go-licenses | Set-Content -Encoding utf8NoBOM third-party-go-licenses.csv

      - name: Upload third-party Go license report
        uses: actions/upload-artifact@v4
        with:
          name: third-party-go-licenses
          path: third-party-go-licenses.csv

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage-windows
          path: coverage.out

  race-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Race-sensitive packages
        run: >-
          go test -race
          ./internal/services
          ./internal/services/container
          ./internal/services/container/runtime
          ./internal/services/execution
          ./internal/services/schedule
          ./internal/services/tools
          ./internal/services/inputclip/runtime
          ./internal/hotkey
          ./pkg/winutil
          ./pkg/capture

  portable-core:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test platform-neutral core
        run: >-
          go test
          ./internal/apperr
          ./internal/automation/target
          ./internal/automation/trace
          ./internal/hotkey
          ./internal/nodes/input
          ./internal/nodes/io
          ./internal/runclassify
          ./internal/services
          ./internal/services/calibration
          ./internal/services/container
          ./internal/services/container/runtime
          ./internal/services/execution
          ./internal/services/expr
          ./internal/services/llm
          ./internal/services/mcpserver
          ./internal/services/nodeoptions
          ./internal/services/recording
          ./internal/services/tools
          ./pkg/capture
          ./pkg/imageutil
          ./pkg/input
          ./pkg/locale
          ./pkg/platform
          ./pkg/runctl
          ./pkg/vision
          ./pkg/winutil

  gui-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            binary: yotta-linux-amd64
          - os: macos-15
            binary: yotta-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.117

      - name: Verify Wails toolchain
        shell: pwsh
        run: ./scripts/verify-wails-version.ps1 -CheckInstalled

      - name: Install frontend dependencies
        run: pnpm -C frontend install --frozen-lockfile

      - name: Generate bindings
        run: |
          set +e
          output="$(wails3 generate bindings -ts ./... 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if printf '%s\n' "$output" | grep -Eq '[1-9][0-9]* warnings? emitted'; then
            echo 'Wails binding generation emitted warnings' >&2
            exit 1
          fi
          if ! printf '%s\n' "$output" | grep -Eq '14 Services, 107 Methods,'; then
            echo 'Wails binding surface changed; review and update the expected RPC count' >&2
            exit 1
          fi

      - name: Build frontend
        run: pnpm -C frontend build

      - name: Compile native GUI
        env:
          CGO_ENABLED: "1"
        run: |
          mkdir -p bin
          go build -tags production -trimpath -o "bin/${{ matrix.binary }}" .

      - name: Package GUI compile artifact
        run: tar -czf "bin/${{ matrix.binary }}.tar.gz" -C bin "${{ matrix.binary }}"

      - name: Upload GUI compile artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: bin/${{ matrix.binary }}.tar.gz
          if-no-files-found: error
