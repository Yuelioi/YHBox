# YHBox 中文文案。键命名约定：
#   sidebar.<bot>       侧栏每个项的 label
#   controls.<state>    BotControls 按钮 / 状态
#   view.<bot>.<key>    各 view 内部文案
#   settings.<key>      设置面板
#   common.<key>        共用通用文案

sidebar:
  automation: Automation
  tools: Tools
  collapse: 收起
  fish: 钓鱼
  cook: 店长
  piano: 弹琴
  battle: 战斗
  rhythm: 音游
  settings: 设置
  help: 帮助
  about: 关于

controls:
  start: 开始
  pause: 暂停
  resume: 继续
  stop: 停止
  state:
    idle: 空闲
    running: 运行中
    paused: 已暂停

settings:
  language: 语言
  language_zh: 中文
  language_en: English
  # 不要在 message 里用全角括号 / 中文分号 - vue-i18n 9 的 message compiler
  # 在 jit 模式下遇到部分 unicode 标点会 throw SyntaxError 让整个 view 挂掉。
  language_restart_hint: 切换语言后部分内容需重启 exe 生效, 包括模板和配置.
  language_changed_title: 已切换语言
  language_changed_desc: UI 已立即生效, 模板和配置切换需要重启程序.

common:
  game_not_detected: 未检测到异环窗口
