file = "bait_product_720.png"
resolution = [1280, 720]
bbox = [179, 95, 293, 235]
note = "720p 坐标2（中上）— 实测"
[[fish.bait_product]]
file = "bait_product_720.png"
resolution = [1280, 720]
bbox = [317, 95, 432, 235]
note = "720p 坐标3（右上）— 实测"
[[fish.bait_product]]
