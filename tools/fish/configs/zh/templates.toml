# 鱼饵不足后的自动购买流程：R 开商店 → 找到万能鱼饵 → 拉满 → 购买 → 确认 → 成功提示

# bait_product 多候选槽位：万能鱼饵会随机出现在商店产品区的其中一个槽位。
# 同一分辨率下注册多条 [[fish.bait_product]]，共用同一张 PNG，bbox 不同 ——
# Detector.BaitInShop 迭代全部候选 ROI，按阅读顺序末位返回（金币款在前、代币款在后）。
# 模板 PNG 是「未选中态」抠图，避免选中态粉色高亮干扰 NCC。
# 720p 网格：行间距 160，列间距 138-139，模板 ~115×140。1/2/3/4 实测，5/6 几何外推。
[[fish.bait_product]]
file = "bait_product_720.png"
resolution = [1280, 720]
bbox = [40, 95, 155, 235]
note = "720p 坐标1（左上）— 实测"
