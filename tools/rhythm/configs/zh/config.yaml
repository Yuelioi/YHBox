# 超强音 rhythm 配置（embed 进 exe）。
# 11×21 小 ROI 居中在 4 轨命中点，对音符进入即触发。
# 亮度阈值 / retrigger / KeyHold 是包级 const 不外置（改这些走代码 review）。
# 用户覆盖：exe 同目录 configs/rhythm/zh/config.yaml 写部分字段（merge 语义）。

version: 1

capture: {}

